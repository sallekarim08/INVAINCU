name: Rafraîchir les données

on:
  schedule:
    # Toutes les 6 heures (heure UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # bouton manuel dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calculer les équipes invaincues
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/build-data.mjs

      - name: Publier le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/invaincus.json
          if git diff --staged --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Données du $(date -u '+%d/%m/%Y %H:%M UTC')"
            git push
          fi
