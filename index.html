<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invaincus — 8 matchs sans défaite</title>
<meta name="description" content="Les équipes qui n'ont pas perdu sur leurs huit derniers matchs, dans neuf championnats européens et brésilien.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --craie:    #edefe9;
    --encre:    #14201a;
    --pelouse:  #1b6b47;
    --ardoise:  #8e9a91;
    --trait:    #d4d9d0;
    --papier:   #f7f8f4;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--craie);
    color: var(--encre);
    font-family: "Barlow", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .enveloppe {
    max-width: 62rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }

  /* ---------- En-tête ---------- */

  .entete { border-bottom: 2px solid var(--encre); padding-bottom: 1.5rem; }

  .compteur {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: clamp(4rem, 17vw, 8.5rem);
    line-height: 0.85;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .compteur span { color: var(--pelouse); }

  .accroche {
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    max-width: 36ch;
    margin: 1rem 0 0;
  }

  .maj {
    margin: 0.75rem 0 0;
    font-size: 0.9rem;
    color: var(--ardoise);
  }

  /* ---------- Onglets de championnat ---------- */

  .onglets {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding: 1.25rem 0 1rem;
    margin: 0 -1.25rem;
    padding-left: 1.25rem;
    padding-right: 1.25rem;
    scrollbar-width: none;
  }

  .onglets::-webkit-scrollbar { display: none; }

  .onglet {
    flex: none;
    font: inherit;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--ardoise);
    background: var(--papier);
    border: 1px solid var(--trait);
    border-radius: 999px;
    padding: 0.45rem 1rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .onglet:hover { color: var(--encre); border-color: var(--ardoise); }

  .onglet[aria-selected="true"] {
    background: var(--encre);
    border-color: var(--encre);
    color: var(--papier);
  }

  .onglet:focus-visible,
  .ligne:focus-visible { outline: 2px solid var(--pelouse); outline-offset: 2px; }

  /* ---------- Liste ---------- */

  .liste { list-style: none; margin: 0; padding: 0; }

  .liste > li { border-top: 1px solid var(--trait); }
  .liste > li:last-child { border-bottom: 1px solid var(--trait); }

  .ligne {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.5rem 1.5rem;
    align-items: center;
    width: 100%;
    padding: 1.1rem 0.25rem;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }

  .ligne:hover .equipe { color: var(--pelouse); }

  .equipe {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: clamp(1.45rem, 4.5vw, 1.9rem);
    line-height: 1.1;
    transition: color 120ms;
  }

  .provenance {
    font-size: 0.88rem;
    color: var(--ardoise);
    grid-column: 1;
  }

  .forme {
    display: flex;
    gap: 4px;
    grid-column: 2;
    grid-row: 1 / span 2;
  }

  .case {
    width: 1.55rem;
    height: 1.55rem;
    display: grid;
    place-items: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    border-radius: 2px;
  }

  .case.v { background: var(--pelouse); color: var(--papier); }
  .case.n { background: transparent; color: var(--ardoise); box-shadow: inset 0 0 0 1px var(--trait); }

  /* ---------- Détail déplié ---------- */

  .detail { padding: 0 0.25rem 1.4rem; }

  .detail table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  .detail th { text-align: left; font-weight: 500; color: var(--ardoise); padding-bottom: 0.4rem; }
  .detail td { padding: 0.35rem 0; border-top: 1px solid var(--trait); }
  .detail td:last-child, .detail th:last-child { text-align: right; }
  .detail .issue { font-weight: 600; }
  .detail .issue.v { color: var(--pelouse); }

  .bilan { margin: 0 0 0.9rem; color: var(--ardoise); font-size: 0.92rem; }

  .a-venir {
    margin: 1.4rem 0 0;
    padding-top: 1.1rem;
    border-top: 1px dashed var(--trait);
  }

  .a-venir h3 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ardoise);
    margin: 0 0 0.6rem;
  }

  .a-venir ul { list-style: none; margin: 0; padding: 0; }

  .a-venir li {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.4rem 0;
    font-size: 0.92rem;
  }

  .a-venir li + li { border-top: 1px solid var(--trait); }

  .a-venir .qui { font-weight: 500; }
  .a-venir .quand { color: var(--ardoise); white-space: nowrap; }

  .rien-de-prevu { font-size: 0.9rem; color: var(--ardoise); font-style: italic; }

  /* ---------- États ---------- */

  .etat {
    padding: 3.5rem 0;
    max-width: 44ch;
  }

  .etat h2 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0 0 0.5rem;
  }

  .etat p { margin: 0; color: var(--ardoise); }

  .pied {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--trait);
    font-size: 0.85rem;
    color: var(--ardoise);
    max-width: 56ch;
  }

  .pied a { color: inherit; }

  @media (max-width: 34rem) {
    .ligne { grid-template-columns: 1fr; }
    .forme { grid-column: 1; grid-row: auto; margin-top: 0.4rem; }
    .case { width: 1.35rem; height: 1.35rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="enveloppe">

  <header class="entete">
    <h1 class="compteur" id="compteur"><span>·</span></h1>
    <p class="accroche" id="accroche">Chargement des résultats.</p>
    <p class="maj" id="maj"></p>
  </header>

  <nav class="onglets" id="onglets" hidden aria-label="Filtrer par championnat"></nav>

  <main id="contenu"></main>

  <footer class="pied">
    Une équipe apparaît ici uniquement si ses huit derniers matchs de championnat ne comptent aucune défaite.
    Les rencontres sont classées de la plus ancienne à la plus récente.
    Données <a href="https://www.football-data.org">football-data.org</a>, rafraîchies toutes les six heures.
  </footer>

</div>

<script>
const contenu  = document.getElementById("contenu");
const compteur = document.getElementById("compteur");
const accroche = document.getElementById("accroche");
const majEl    = document.getElementById("maj");
const onglets  = document.getElementById("onglets");

let equipes = [];
let championnatActif = ""; // "" = tous les championnats

const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;

function depuis(iso) {
  const heures = Math.floor((Date.now() - new Date(iso)) / 3600000);
  if (heures < 1) return "à l'instant";
  if (heures < 24) return `il y a ${pluriel(heures, "heure")}`;
  return `il y a ${pluriel(Math.floor(heures / 24), "jour")}`;
}

const dateCourte = (iso) =>
  new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

function etat(titre, message) {
  contenu.innerHTML = "";
  const bloc = document.createElement("div");
  bloc.className = "etat";
  bloc.innerHTML = `<h2></h2><p></p>`;
  bloc.querySelector("h2").textContent = titre;
  bloc.querySelector("p").textContent = message;
  contenu.append(bloc);
}

function detailHtml(equipe) {
  const lignes = equipe.detail.map((m) => `
    <tr>
      <td>${dateCourte(m.date)}</td>
      <td>${m.domicile ? "reçoit" : "se déplace à"} ${m.adversaire}</td>
      <td>${m.score}</td>
      <td class="issue ${m.issue.toLowerCase()}">${m.issue === "V" ? "Victoire" : "Nul"}</td>
    </tr>`).join("");

  const diff = equipe.butsMarques - equipe.butsEncaisses;

  return `
    <div class="detail">
      <p class="bilan">
        ${pluriel(equipe.victoires, "victoire")}, ${pluriel(equipe.nuls, "nul")} ·
        ${equipe.butsMarques} buts marqués, ${equipe.butsEncaisses} encaissés
        (${diff >= 0 ? "+" : ""}${diff})
      </p>
      <table>
        <thead><tr><th>Date</th><th>Rencontre</th><th>Score</th><th>Issue</th></tr></thead>
        <tbody>${lignes}</tbody>
      </table>
      ${aVenirHtml(equipe)}
    </div>`;
}

function aVenirHtml(equipe) {
  const matchs = equipe.prochainsMatchs ?? [];

  if (!matchs.length) {
    return `
      <div class="a-venir">
        <h3>Prochain match</h3>
        <p class="rien-de-prevu">Aucun match programmé pour l'instant.</p>
      </div>`;
  }

  const lignes = matchs.map((m) => `
    <li>
      <span class="qui">${m.domicile} – ${m.exterieur}</span>
      <span class="quand">${dateCourte(m.date)} · ${m.competition}</span>
    </li>`).join("");

  return `
    <div class="a-venir">
      <h3>${matchs.length > 1 ? "Prochains matchs" : "Prochain match"}</h3>
      <ul>${lignes}</ul>
    </div>`;
}

function afficher(liste) {
  contenu.innerHTML = "";

  if (!liste.length) {
    etat(
      "Aucune équipe pour ce filtre",
      "Aucune formation ne tient actuellement huit matchs sans défaite ici. Choisis un autre championnat ou reviens après la prochaine journée."
    );
    return;
  }

  const ul = document.createElement("ul");
  ul.className = "liste";

  liste.forEach((equipe, index) => {
    const li = document.createElement("li");
    const idDetail = `detail-${index}`;

    const bouton = document.createElement("button");
    bouton.className = "ligne";
    bouton.type = "button";
    bouton.setAttribute("aria-expanded", "false");
    bouton.setAttribute("aria-controls", idDetail);
    bouton.innerHTML = `
      <span class="equipe"></span>
      <span class="provenance"></span>
      <span class="forme">${equipe.forme
        .map((i) => `<span class="case ${i.toLowerCase()}">${i}</span>`)
        .join("")}</span>`;
    bouton.querySelector(".equipe").textContent = equipe.nom;
    bouton.querySelector(".provenance").textContent =
      `${equipe.competition} · dernier match ${dateCourte(equipe.dernierMatch)}`;

    const zone = document.createElement("div");
    zone.id = idDetail;
    zone.hidden = true;

    bouton.addEventListener("click", () => {
      const ouvert = !zone.hidden;
      zone.hidden = ouvert;
      bouton.setAttribute("aria-expanded", String(!ouvert));
      if (!ouvert && !zone.innerHTML) zone.innerHTML = detailHtml(equipe);
    });

    li.append(bouton, zone);
    ul.append(li);
  });

  contenu.append(ul);
}

function choisirOnglet(nom) {
  championnatActif = nom;

  [...onglets.children].forEach((bouton) => {
    bouton.setAttribute("aria-selected", String(bouton.dataset.nom === nom));
  });

  afficher(nom ? equipes.filter((e) => e.competition === nom) : equipes);
}

function construireOnglets(championnats) {
  onglets.innerHTML = "";

  const creerOnglet = (nom, libelle) => {
    const bouton = document.createElement("button");
    bouton.type = "button";
    bouton.className = "onglet";
    bouton.textContent = libelle;
    bouton.dataset.nom = nom;
    bouton.setAttribute("role", "tab");
    bouton.setAttribute("aria-selected", String(nom === championnatActif));
    bouton.addEventListener("click", () => choisirOnglet(nom));
    onglets.append(bouton);
  };

  creerOnglet("", "Tous");
  championnats.forEach((nom) => creerOnglet(nom, nom));

  onglets.hidden = false;
}

async function demarrer() {
  let donnees;
  try {
    const reponse = await fetch("data/invaincus.json", { cache: "no-store" });
    if (!reponse.ok) throw new Error(reponse.status);
    donnees = await reponse.json();
  } catch {
    compteur.textContent = "—";
    accroche.textContent = "Les données n'ont pas pu être chargées.";
    etat(
      "Fichier de données introuvable",
      "Lance le workflow « Rafraîchir les données » depuis l'onglet Actions du dépôt, puis recharge cette page."
    );
    return;
  }

  equipes = donnees.equipes ?? [];

  compteur.innerHTML = equipes.length ? `<span>${equipes.length}</span>` : "<span>0</span>";
  accroche.textContent = equipes.length
    ? `${equipes.length > 1 ? "équipes n'ont" : "équipe n'a"} pas perdu sur ${donnees.serieExigee} matchs.`
    : `équipe ne tient ${donnees.serieExigee} matchs sans défaite pour le moment.`;
  majEl.textContent = `Mis à jour ${depuis(donnees.genereLe)} · ${donnees.competitionsAnalysees.length} championnats analysés`;

  const championnats = [...(donnees.competitionsAnalysees ?? [])].sort();
  if (championnats.length > 0) {
    construireOnglets(championnats);
  }

  afficher(equipes);
}

demarrer();
</script>
</body>
</html>
